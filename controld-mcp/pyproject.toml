[project]
name = "controld-mcp"
version = "0.1.0"
description = "MCP server wrapping the Control D REST API (profiles, devices, filters, rules, access IPs)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
